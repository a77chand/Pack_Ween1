# Serves the game page from GitHub Pages so it opens instantly, even while the
# free Render API server is waking up. Only the static files in backend/public go here.
name: pages

on:
  push:
    branches: [main]
    paths: ["backend/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend/public
      - id: deployment
        uses: actions/deploy-pages@v4
