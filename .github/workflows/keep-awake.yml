# Render's free tier sleeps a service after 15 minutes without traffic, and
# waking it takes 20-60 s. Pinging every 10 minutes keeps the demo instant.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: curl -fsS -o /dev/null -m 90 -w "HTTP %{http_code} in %{time_total}s\n" https://pack-ween.onrender.com/
